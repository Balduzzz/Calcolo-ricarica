<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ricarica EV">
<title>CALCOLO TEMPO RICARICA</title>
<style>
:root{--bg:#f3f5f8;--card:#fff;--txt:#111827;--mut:#6b7280;--acc:#10b981;--soft:#d1fae5;--brd:#e5e7eb;--amb:#f59e0b;--amb-soft:rgba(245,158,11,.15)}
@media(prefers-color-scheme:dark){:root{--bg:#0f172a;--card:#1e293b;--txt:#f8fafc;--mut:#94a3b8;--acc:#34d399;--soft:rgba(52,211,153,.15);--brd:#334155;--amb:#fbbf24;--amb-soft:rgba(251,191,36,.15)}}
*{box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,sans-serif;-webkit-tap-highlight-color:transparent}
body{margin:0;padding:16px 12px;background:var(--bg);color:var(--txt);display:flex;justify-content:center}
.app{width:100%;max-width:430px}
.hdr{display:flex;justify-content:space-between;align-items:center;margin:0 0 12px}
h1{font-size:1.2rem;margin:0;font-weight:800;letter-spacing:-.01em}
.live-badge{font-size:.72rem;font-weight:800;padding:4px 10px;border-radius:99px;background:var(--soft);color:var(--acc);letter-spacing:.03em;white-space:nowrap}
.live-badge.off{background:var(--amb-soft);color:var(--amb)}
.card{background:var(--card);border-radius:20px;padding:15px;box-shadow:0 4px 20px rgba(0,0,0,.06);margin-bottom:12px;border:1px solid var(--brd);transition:opacity .2s;overflow:hidden}
.card.dis{opacity:.5;pointer-events:none}
.ct{font-size:.78rem;text-transform:uppercase;letter-spacing:.04em;color:var(--mut);font-weight:800;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row3{display:grid;grid-template-columns:1.25fr 1fr 0.95fr;gap:8px}
label{display:block;font-size:.82rem;color:var(--mut);font-weight:600}
.iw{position:relative;display:flex;align-items:center}
input{width:100%;height:58px;padding:10px 38px 10px 12px;font-size:1.65rem;font-weight:800;border-radius:14px;border:2px solid var(--brd);background:var(--bg);color:var(--txt);outline:none;-moz-appearance:textfield;font-variant-numeric:tabular-nums;text-align:center}
input::-webkit-outer-spin-button,input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
input:focus{border-color:var(--acc)}
.u{position:absolute;right:12px;font-size:1rem;font-weight:800;color:var(--mut);pointer-events:none}
input[type="time"]::-webkit-calendar-picker-indicator{display:none;-webkit-appearance:none}
.prog-row{background:var(--card);padding:12px 14px;border-radius:16px;border:1px solid var(--brd);height:112px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.prog-left{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:space-between;height:100%}
.prog-right{display:flex;align-items:center;gap:8px;flex-shrink:0}
.arr-col{display:flex;flex-direction:column;gap:6px}
.arr-btn{width:44px;height:40px;border:1px solid #cbd5e1;background:#f8fafc;color:#0f172a;border-radius:11px;font-size:.9rem;font-weight:800;cursor:pointer;display:flex;align-items:center;justify-content:center;user-select:none}
.arr-btn:active{background:#dcfce7;color:#15803d;border-color:#10b981}
.btn-x{width:36px;height:36px;border:none;background:#fee2e2;color:#b91c1c;border-radius:10px;font-size:14px;font-weight:800;cursor:pointer;display:flex;align-items:center;justify-content:center}
.mode-pill{display:flex;flex-direction:column;background:#f1f5f9;border-radius:11px;padding:3px;gap:4px}
.mode-pill button{border:none;background:transparent;font-size:12px;font-weight:800;padding:7px 10px;border-radius:8px;cursor:pointer;color:#64748b;white-space:nowrap}
.mode-pill button.act{background:#ffffff;color:#0f172a;box-shadow:0 1px 4px rgba(0,0,0,.12)}
.rc{border:2px solid var(--acc)}.rc.wait{border-color:var(--brd);opacity:.7}
.sb{background:var(--bg);padding:12px 6px;border-radius:14px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;min-height:96px;min-width:0;overflow:hidden;gap:6px}
.sb.hi{background:var(--soft)}.rc.wait .sb.hi{background:var(--bg)}
.sl{font-size:.66rem;color:var(--mut);font-weight:800;display:block;line-height:1.15;text-transform:uppercase;letter-spacing:-.01em}
.sv{font-size:1.45rem;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap;letter-spacing:-.03em;line-height:1.1}
.sb.hi .sv{color:var(--acc);font-size:1.38rem}.rc.wait .sb.hi .sv{color:var(--mut)}
.action-btn{width:100%;margin-top:12px;padding:0 13px;border:none;border-radius:14px;background:#ef4444;color:#fff;font-size:.98rem;font-weight:800;cursor:pointer;letter-spacing:.02em;height:50px;white-space:nowrap}
.rst{background:none;border:none;color:var(--acc);font-size:.78rem;font-weight:700;cursor:pointer;text-transform:uppercase;padding:0 4px}
.rst.mut{color:var(--mut)}
.adm{text-align:center;margin-top:6px}
.adm-btn{background:none;border:none;color:var(--mut);font-size:.8rem;cursor:pointer;opacity:.7;padding:6px 12px;font-weight:700}
.cg{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}.cg input{height:46px;font-size:1.1rem;padding:8px}
</style>
</head>
<body>
<div class="app">
<div class="hdr">
<h1>CALCOLO TEMPO RICARICA</h1>
<span class="live-badge off" id="liveBadge">OFFLINE</span>
</div>

<div id="hardwareMount"></div>

<div class="card" id="cardCurrent">
<div class="ct"><span>AUTONOMIA DI PARTENZA</span></div>
<div class="row">
<div class="iw"><input type="number" id="inKm" min="0" inputmode="numeric" pattern="[0-9]*"><span class="u">km</span></div>
<div class="iw"><input type="number" id="inPerc" min="0" max="100" inputmode="numeric" pattern="[0-9]*"><span class="u">%</span></div>
</div>
</div>

<div class="card" id="cardLive" style="background:var(--soft); border-color:var(--acc);">
<div class="ct" style="color:var(--acc);"><span>AUTONOMIA ATTUALE (IN TEMPO REALE)</span></div>
<div class="row">
<div class="iw"><input type="text" id="curKmLive" value="--" readonly tabindex="-1" style="background:var(--card); border-color:var(--acc); color:var(--acc);"><span class="u">km</span></div>
<div class="iw"><input type="text" id="curPercLive" value="--" readonly tabindex="-1" style="background:var(--card); border-color:var(--acc); color:var(--acc);"><span class="u">%</span></div>
</div>
</div>

<div class="card rc wait" id="rc">
<div class="ct"><span>AUTONOMIA A FINE CARICA</span></div>
<div class="row3">
<div class="sb hi"><span class="sl" id="lblTempoFin">TEMPO RIMANENTE</span><span class="sv" id="rt">--</span></div>
<div class="sb"><span class="sl">AUTONOMIA KM</span><span class="sv" id="rvKm">--</span></div>
<div class="sb"><span class="sl">AUTONOMIA %</span><span class="sv" id="rvPerc">--</span></div>
</div>
<button type="button" class="action-btn" id="btnResetSession" style="display:none;">🔄 Resetta Ricarica e kWh</button>
<div id="storicoMount"></div>
</div>

<div class="adm"><button type="button" class="adm-btn" onclick="unlock()">🔒 Setup</button></div>
<div class="card" id="admBox" style="display:none">
<div class="ct"><span>Setup</span><div><button type="button" class="rst mut" onclick="resetSetup()">Reset</button> • <button type="button" class="rst" onclick="lock()">Blocca</button></div></div>
<div class="cg">
<div><label>Velocità (km/h)</label><input type="number" id="cV" value="14.21" min="0.1" step="0.01" inputmode="decimal"></div>
<div><label>km per 1%</label><input type="number" id="cKP" value="3.37" min="0.1" step="0.01" inputmode="decimal"></div>
<div><label>% per ora</label><input type="number" id="cPO" value="4.21" min="0.01" step="0.01" inputmode="decimal"></div>
<div><label>% per km</label><input type="number" id="cPK" value="0.296" min="0.001" step="0.001" inputmode="decimal"></div>
</div>
</div>
</div>
<script type="module">
const gHost = ['www', 'gstatic', 'com'].join('.');
const gFolder = ['firebasejs', '10.12.2'].join('/');
const FB_BASE = `https://${gHost}/${gFolder}/`;

const { initializeApp } = await import(FB_BASE + 'firebase-app.js');
const { getDatabase, ref, set, update, onValue, onDisconnect, remove } = await import(FB_BASE + 'firebase-database.js');

const DB_HOST = ['ricarica-condivisa-default-rtdb', 'europe-west1', 'firebasedatabase', 'app'].join('.');
const firebaseConfig = { databaseURL: 'https://' + DB_HOST };

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const sharedRef = ref(db, "stato_condiviso");
const liveRef = ref(db, "ricarica_live");
const storicoRef = ref(db, "storico_ricariche");
const connRef = ref(db, ".info/connected");
const presenceListRef = ref(db, "utenti_online");
const clientId = "u_" + Math.random().toString(36).slice(2, 10) + "_" + Date.now();
const myPresenceRef = ref(db, "utenti_online/" + clientId);

const STORICO_URL = 'https://' + DB_HOST + '/storico_ricariche.json';
const NUOVO_HOST = ['calcolo-ricarica-2', 'netlify', 'app'].join('.');
const FN_URL = 'https://' + NUOVO_HOST + '/.netlify/functions/check-meross';

const PIN = '1234', STORE_KEY = 'ev_ricarica_setup';
const DEFAULTS = { cV: '14.21', cKP: '3.37', cPO: '4.21', cPK: '0.296' };

let isConnected = false, onlineCount = 0, isSyncingFromCloud = false;
let liveState = {};
let presaAttualmenteAccesa = false, programmazioneAttiva = false;
let spegniMode = 'time';
let endTargetTs = null;

function updateLiveBadge() {
  const badge = document.getElementById('liveBadge');
  if (!isConnected) { badge.textContent = 'OFFLINE'; badge.classList.add('off'); }
  else { badge.textContent = `LIVE ${Math.max(1, onlineCount)}/4`; badge.classList.remove('off'); }
}

onValue(connRef, (snap) => {
  isConnected = (snap.val() === true);
  if (isConnected) { onDisconnect(myPresenceRef).remove(); set(myPresenceRef, true); }
  updateLiveBadge();
});

onValue(presenceListRef, (snap) => {
  const val = snap.val();
  onlineCount = val ? Object.keys(val).length : 0;
  updateLiveBadge();
});

window.addEventListener('beforeunload', () => { try { remove(myPresenceRef); } catch (e) {} });

function getParams() {
  return {
    v: Math.max(0.1, +document.getElementById('cV').value || 14.21),
    kp: Math.max(0.1, +document.getElementById('cKP').value || 3.37),
    pk: Math.max(0.001, +document.getElementById('cPK').value || 0.296)
  };
}

function loadSetup() {
  try {
    const saved = JSON.parse(localStorage.getItem(STORE_KEY));
    if (saved) ['cV', 'cKP', 'cPO', 'cPK'].forEach(id => { if (saved[id]) document.getElementById(id).value = saved[id]; });
  } catch (e) {}
}

function saveSetup(sync = true) {
  try {
    const data = {};
    ['cV', 'cKP', 'cPO', 'cPK'].forEach(id => { data[id] = document.getElementById(id).value; });
    localStorage.setItem(STORE_KEY, JSON.stringify(data));
  } catch (e) {}
  if (sync) pushSharedState();
}

window.unlock = () => { if (prompt('Inserisci codice PIN:') === PIN) document.getElementById('admBox').style.display = 'block'; };
window.lock = () => { document.getElementById('admBox').style.display = 'none'; };
window.resetSetup = () => {
  if (confirm('Ripristinare i parametri predefiniti calibrati?')) {
    ['cV', 'cKP', 'cPO', 'cPK'].forEach(id => { document.getElementById(id).value = DEFAULTS[id]; });
    saveSetup(true);
    aggiornaCalcoli();
  }
};

function bindHold(btnId, fn) {
  const btn = document.getElementById(btnId);
  if (!btn) return;
  let t1 = null, t2 = null, t3 = null;
  const clear = () => { clearTimeout(t1); clearInterval(t2); clearTimeout(t3); };
  const start = (e) => {
    e.preventDefault();
    if (btn.disabled) return;
    fn();
    t1 = setTimeout(() => {
      t2 = setInterval(fn, 150);
      t3 = setTimeout(() => { clearInterval(t2); t2 = setInterval(fn, 70); }, 2200);
    }, 350);
  };
  btn.addEventListener('mousedown', start);
  btn.addEventListener('touchstart', start, { passive: false });
  btn.addEventListener('mouseup', clear);
  btn.addEventListener('mouseleave', clear);
  btn.addEventListener('touchend', clear);
  btn.addEventListener('touchcancel', clear);
}

document.getElementById('hardwareMount').innerHTML = `
  <div style="margin-bottom:12px; border-radius:20px; background:var(--card); box-shadow:0 4px 20px rgba(0,0,0,.06); border:1px solid var(--brd); overflow:hidden;">
    <div id="stato-presa-badge" style="text-align:center; padding:15px; font-weight:800; font-size:14px; line-height:1.45; cursor:pointer; background:var(--card); color:#64748b;" title="Tocca per aggiornare subito">
      ⏳ Lettura presa e contatore kWh...
    </div>
    <div style="display:flex; flex-direction:column; gap:10px; padding:12px 14px; background:var(--bg); border-top:1px solid var(--brd);">
      <button type="button" id="btn-toggle-presa" style="width:100%; padding:14px; border:none; border-radius:14px; font-weight:800; font-size:16px; cursor:pointer; background:#e2e8f0; color:#334155;">
        ⏳ Verifica presa...
      </button>

      <div id="box-programmazione" style="display:flex; flex-direction:column; gap:10px; transition:opacity 0.2s;">
        <div class="prog-row">
          <div class="prog-left">
            <span style="font-size:16px; font-weight:800; color:#15803d; text-transform:uppercase;">🟢 INIZIA</span>
            <input type="time" id="ora-accensione" style="width:100%; height:44px; text-align:left; border:none; font-size:30px; font-weight:800; color:var(--txt); background:transparent; outline:none; padding:0;">
            <div style="font-size:14px; font-weight:700; color:var(--mut);" id="subAcc">Avvio immediato</div>
          </div>
          <div class="prog-right">
            <button type="button" id="btn-canc-accendi" class="btn-x" style="visibility:hidden;">✕</button>
            <div class="arr-col">
              <button type="button" id="upAcc" class="arr-btn">▲</button>
              <button type="button" id="dnAcc" class="arr-btn">▼</button>
            </div>
          </div>
        </div>

        <div class="prog-row">
          <div class="prog-left">
            <span style="font-size:16px; font-weight:800; color:#b91c1c; text-transform:uppercase;">🔴 SPEGNI</span>
            <input type="time" id="ora-spegnimento" style="width:100%; height:44px; text-align:left; border:none; font-size:30px; font-weight:800; color:var(--txt); background:transparent; outline:none; padding:0;">
            <div id="wrapPercSpegni" style="display:none; align-items:center; height:44px; gap:4px;">
              <input type="number" id="perc-spegnimento" min="1" max="100" placeholder="--" inputmode="numeric" style="width:56px; height:44px; text-align:left; border:none; font-size:30px; font-weight:800; color:var(--txt); background:transparent; outline:none; padding:0;">
              <span style="font-size:20px; font-weight:800; color:var(--mut);">%</span>
            </div>
            <div style="font-size:14px; font-weight:800; color:#b91c1c;" id="subSpeg">Nessuno spegnimento</div>
          </div>
          <div class="prog-right">
            <button type="button" id="btn-canc-spegni" class="btn-x" style="visibility:hidden;">✕</button>
            <div class="mode-pill" id="pillSpegniMode">
             <button type="button" id="btnModeTime" class="act" style="font-size:15px; padding:5px 10px;"><span style="font-size:18px;">🕒</span> Ora</button>
             <button type="button" id="btnModePerc" style="font-size:15px; padding:5px 10px;"><span style="font-size:18px;">🔋</span> %</button>
            </div>
            <div class="arr-col">
              <button type="button" id="upSpeg" class="arr-btn">▲</button>
              <button type="button" id="dnSpeg" class="arr-btn">▼</button>
            </div>
          </div>
        </div>
      </div>

      <button type="button" id="btn-attiva-prog" style="width:100%; padding:14px; border:none; border-radius:14px; font-weight:800; font-size:15px; cursor:pointer; background:#2563eb; color:#ffffff;">
        📅 Attiva Programmazione
      </button>
    </div>
  </div>
`;
function pushSharedState() {
  if (isSyncingFromCloud) return;
  const payload = {
    inKm: document.getElementById('inKm').value,
    inPerc: document.getElementById('inPerc').value,
    bozzaAcc: document.getElementById('ora-accensione').value,
    bozzaSpegMode: spegniMode,
    bozzaSpegOra: document.getElementById('ora-spegnimento').value,
    bozzaSpegPerc: document.getElementById('perc-spegnimento').value,
    setup: {
      cV: document.getElementById('cV').value,
      cKP: document.getElementById('cKP').value,
      cPO: document.getElementById('cPO').value,
      cPK: document.getElementById('cPK').value
    },
    updatedAt: Date.now()
  };
  try { set(sharedRef, payload); } catch (e) {}
}

function aggiornaVisibilitaX() {
  const btnXAcc = document.getElementById('btn-canc-accendi');
  const btnXSpeg = document.getElementById('btn-canc-spegni');
  const inpAcc = document.getElementById('ora-accensione');
  const inpSpeg = document.getElementById('ora-spegnimento');

  // Mostra "--:--" automatico su iPhone/smartphone quando l'orario è vuoto
  [inpAcc, inpSpeg].forEach((inp, idx) => {
    if (!inp) return;
    let ph = document.getElementById('ph-time-' + idx);
    if (!ph) {
      inp.parentElement.style.position = 'relative';
      ph = document.createElement('span');
      ph.id = 'ph-time-' + idx;
      ph.textContent = '--:--';
      ph.style.cssText = 'position:absolute; left:0; font-size:30px; font-weight:800; color:var(--mut); opacity:0.45; pointer-events:none;';
      inp.parentElement.insertBefore(ph, inp);
    }
    const nascosto = (idx === 1 && spegniMode !== 'time') || Boolean(inp.value);
    ph.style.display = nascosto ? 'none' : 'block';
  });

  if (programmazioneAttiva) {
    btnXAcc.style.visibility = 'hidden';
    btnXSpeg.style.visibility = 'hidden';
    return;
  }
  btnXAcc.style.visibility = inpAcc.value ? 'visible' : 'hidden';
  const hasSpegVal = (spegniMode === 'time')
    ? Boolean(inpSpeg.value)
    : Boolean(document.getElementById('perc-spegnimento').value);
  btnXSpeg.style.visibility = hasSpegVal ? 'visible' : 'hidden';
}
function setSpegniMode(mode, sync = true) {
  spegniMode = mode;
  document.getElementById('btnModeTime').classList.toggle('act', mode === 'time');
  document.getElementById('btnModePerc').classList.toggle('act', mode === 'perc');
  document.getElementById('ora-spegnimento').style.display = mode === 'time' ? 'block' : 'none';
  document.getElementById('wrapPercSpegni').style.display = mode === 'perc' ? 'flex' : 'none';
  if (mode === 'perc') {
    const inpP = document.getElementById('perc-spegnimento');
    const curP = Math.max(0, +document.getElementById('curPercLive').value || +document.getElementById('inPerc').value || 0);
    if (inpP.value !== '' && +inpP.value <= curP) {
      inpP.value = Math.min(100, curP + 1);
    }
  }
  aggiornaVisibilitaX();
  aggiornaCalcoli();
  if (sync) pushSharedState();
}

document.getElementById('btnModeTime').addEventListener('click', () => { if (!programmazioneAttiva) setSpegniMode('time', true); });
document.getElementById('btnModePerc').addEventListener('click', () => { if (!programmazioneAttiva) setSpegniMode('perc', true); });

function calcolaProssimoTimestamp(timeStr, baseTs = Date.now()) {
  const [hh, mm] = timeStr.split(':').map(Number);
  const baseDate = new Date(baseTs);
  const target = new Date(baseDate.getFullYear(), baseDate.getMonth(), baseDate.getDate(), hh, mm, 0, 0);
  if (target.getTime() <= baseTs) target.setDate(target.getDate() + 1);
  return target.getTime();
}

function formattaOraDaTs(ts) {
  const dt = new Date(ts);
  return String(dt.getHours()).padStart(2, '0') + ':' + String(dt.getMinutes()).padStart(2, '0');
}

function fmtDurata(h) {
  if (h <= 0) return '0h 00m';
  const tm = Math.round(h * 60);
  return Math.floor(tm / 60) + 'h ' + String(tm % 60).padStart(2, '0') + 'm';
}

function fmtCountdown(ms) {
  const totSec = Math.max(0, Math.floor(ms / 1000));
  const h = Math.floor(totSec / 3600);
  const m = Math.floor((totSec % 3600) / 60);
  const s = totSec % 60;
  return `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
}

function applicaVincoliOrari() {
  const inpAcc = document.getElementById('ora-accensione');
  const inpSpeg = document.getElementById('ora-spegnimento');
  const nowTs = Date.now();
  if (inpAcc.value) {
    const accTs = calcolaProssimoTimestamp(inpAcc.value, nowTs);
    if (accTs - nowTs > 23 * 3600000) inpAcc.value = formattaOraDaTs(nowTs + 60000);
  }
  const baseStart = inpAcc.value ? calcolaProssimoTimestamp(inpAcc.value, nowTs) : nowTs;
  if (spegniMode === 'time' && inpSpeg.value) {
    const spegTs = calcolaProssimoTimestamp(inpSpeg.value, baseStart);
    if (spegTs - baseStart > 23 * 3600000) inpSpeg.value = formattaOraDaTs(baseStart + 60000);
  }
}

function stepAccensione(deltaMin) {
  if (programmazioneAttiva) return;
  const inp = document.getElementById('ora-accensione');
  const now = new Date();
  let baseMin = now.getHours() * 60 + now.getMinutes();
  if (inp.value) { const [h, m] = inp.value.split(':').map(Number); baseMin = h * 60 + m; }
  const nuovoTot = ((baseMin + deltaMin) % 1440 + 1440) % 1440;
  inp.value = `${String(Math.floor(nuovoTot / 60)).padStart(2, '0')}:${String(nuovoTot % 60).padStart(2, '0')}`;
  applicaVincoliOrari();
  aggiornaVisibilitaX();
  aggiornaCalcoli();
  pushSharedState();
}

function stepSpegnimento(delta) {
  if (programmazioneAttiva) return;
  if (spegniMode === 'time') {
    const inp = document.getElementById('ora-spegnimento');
    const now = new Date();
    let baseMin = now.getHours() * 60 + now.getMinutes();
    if (inp.value) { const [h, m] = inp.value.split(':').map(Number); baseMin = h * 60 + m; }
    const nuovoTot = ((baseMin + delta) % 1440 + 1440) % 1440;
    inp.value = `${String(Math.floor(nuovoTot / 60)).padStart(2, '0')}:${String(nuovoTot % 60).padStart(2, '0')}`;
    applicaVincoliOrari();
  } else {
    const inpP = document.getElementById('perc-spegnimento');
    const curP = Math.max(0, +document.getElementById('curPercLive').value || +document.getElementById('inPerc').value || 0);
    const minP = Math.min(100, curP + 1);
    let val = (inpP.value === '' ? Math.max(80, minP) : +inpP.value) + delta;
    if (val < minP) val = minP;
    if (val > 100) val = 100;
    inpP.value = val;
  }
  aggiornaVisibilitaX();
  aggiornaCalcoli();
  pushSharedState();
}

function getSecondiRealiAccumulati() {
  let sec = liveState.secondiAccumulati || 0;
  if (liveState.stato === 'in_corso' && liveState.inizioSegmentoTs) {
    sec += Math.max(0, (Date.now() - liveState.inizioSegmentoTs) / 1000);
  }
  return sec;
}

function aggiornaCalcoli() {
  const elKm = document.getElementById('inKm');
  const elPerc = document.getElementById('inPerc');
  const rc = document.getElementById('rc');
  const curKmEl = document.getElementById('curKmLive');
  const curPercEl = document.getElementById('curPercLive');
  const subAcc = document.getElementById('subAcc');
  const subSpeg = document.getElementById('subSpeg');

  const inpAcc = document.getElementById('ora-accensione');
  const inpSpeg = document.getElementById('ora-spegnimento');
  const inpSpegPerc = document.getElementById('perc-spegnimento');

  subAcc.textContent = inpAcc.value ? `Avvio alle ${inpAcc.value}` : 'Avvio immediato';

  if (elKm.value === '' || elPerc.value === '') {
    rc.classList.add('wait');
    curKmEl.value = '--'; curPercEl.value = '--';
    document.getElementById('rt').textContent = '--';
    document.getElementById('rvKm').textContent = '--';
    document.getElementById('rvPerc').textContent = '--';
    subSpeg.textContent = 'Inserisci autonomia di partenza';
    endTargetTs = null;
    return;
  }

  rc.classList.remove('wait');
  const ka = Math.max(0, +elKm.value || 0);
  const pa = Math.min(100, Math.max(0, +elPerc.value || 0));
  const { v, kp } = getParams();
  const percPerOra = v / kp;
  const kpReale = (ka > 0 && pa > 0) ? (ka / pa) : kp;
  const maxKm = Math.round(100 * kpReale);

  const secReali = getSecondiRealiAccumulati();
  const gainedPercNow = (secReali / 3600) * percPerOra;
  const curPerc = Math.min(100, Math.round(pa + gainedPercNow));
  const curKm = Math.min(maxKm, Math.round(ka + gainedPercNow * kpReale));
  curKmEl.value = curKm;
  curPercEl.value = curPerc;

  const nowTs = Date.now();
  const staCaricando = Boolean(liveState.stato === 'in_corso' || (liveState.wattAttuali || 0) > 50);

  // Se è impostato un orario futuro di INIZIA, la carica partirà da quell'ora (partendo dall'autonomia attuale)
  const hasFutureStart = Boolean(inpAcc.value);
  const baseStartTs = hasFutureStart
    ? calcolaProssimoTimestamp(inpAcc.value, nowTs)
    : (staCaricando ? (nowTs - secReali * 1000) : nowTs);

  const refPerc = hasFutureStart ? curPerc : pa;
  const refKm = hasFutureStart ? curKm : ka;

  if (programmazioneAttiva && liveState.spegnimentoProgrammatoTs && liveState.spegnimentoProgrammatoTs > nowTs) {
    endTargetTs = liveState.spegnimentoProgrammatoTs;
    const effStart = (liveState.accensioneProgrammataTs && liveState.accensioneProgrammataTs > nowTs)
      ? liveState.accensioneProgrammataTs
      : baseStartTs;
    const totHours = Math.max(0, (endTargetTs - effStart) / 3600000);
    const finPerc = Math.min(100, Math.round(refPerc + totHours * percPerOra));
    const finKm = Math.min(maxKm, Math.round(refKm + totHours * percPerOra * kpReale));
    document.getElementById('rvKm').textContent = `${finKm} km`;
    document.getElementById('rvPerc').textContent = `${finPerc}%`;
    const oraStopStr = formattaOraDaTs(endTargetTs);
    subSpeg.textContent = (spegniMode === 'perc')
      ? `Stop programmato: ${oraStopStr}`
      : `Stop: ${oraStopStr} • Batteria: ${finPerc}%`;
    if (!staCaricando || (liveState.accensioneProgrammataTs && liveState.accensioneProgrammataTs > nowTs)) {
      document.getElementById('lblTempoFin').textContent = 'DURATA STIMATA';
      document.getElementById('rt').textContent = fmtDurata(totHours);
    }
  } else if (spegniMode === 'perc') {
    if (inpSpegPerc.value === '') {
      endTargetTs = null;
      document.getElementById('lblTempoFin').textContent = 'TEMPO RIMANENTE';
      document.getElementById('rt').textContent = '--';
      document.getElementById('rvKm').textContent = `${curKm} km`;
      document.getElementById('rvPerc').textContent = `${curPerc}%`;
      subSpeg.textContent = 'Imposta % di spegnimento';
      return;
    }
    if (!programmazioneAttiva && document.activeElement !== inpSpegPerc && +inpSpegPerc.value <= curPerc) {
      inpSpegPerc.value = Math.min(100, curPerc + 1);
    }
    const targetP = Math.min(100, Math.max(curPerc, +inpSpegPerc.value || 80));
    const deltaP = Math.max(0, targetP - refPerc);
    const totHours = deltaP / percPerOra;
    endTargetTs = baseStartTs + Math.round(totHours * 3600000);
    const finKm = (targetP === curPerc) ? curKm : Math.min(maxKm, Math.round(refKm + deltaP * kpReale));
    document.getElementById('rvKm').textContent = `${finKm} km`;
    document.getElementById('rvPerc').textContent = `${targetP}%`;
    subSpeg.textContent = `Fine stimata: ${formattaOraDaTs(endTargetTs)}`;
    if (!staCaricando || hasFutureStart) {
      document.getElementById('lblTempoFin').textContent = 'DURATA STIMATA';
      document.getElementById('rt').textContent = fmtDurata(totHours);
    }
  } else if (inpSpeg.value) {
    endTargetTs = calcolaProssimoTimestamp(inpSpeg.value, baseStartTs);
    const totHours = Math.max(0, (endTargetTs - baseStartTs) / 3600000);
    const finPerc = Math.min(100, Math.round(refPerc + totHours * percPerOra));
    const finKm = Math.min(maxKm, Math.round(refKm + totHours * percPerOra * kpReale));
    document.getElementById('rvKm').textContent = `${finKm} km`;
    document.getElementById('rvPerc').textContent = `${finPerc}%`;
    subSpeg.textContent = `Batteria stimata: ${finPerc}%`;
    if (!staCaricando || hasFutureStart) {
      document.getElementById('lblTempoFin').textContent = 'DURATA STIMATA';
      document.getElementById('rt').textContent = fmtDurata(totHours);
    }
  } else {
    endTargetTs = null;
    document.getElementById('lblTempoFin').textContent = 'TEMPO RIMANENTE';
    document.getElementById('rt').textContent = '--';
    document.getElementById('rvKm').textContent = `${curKm} km`;
    document.getElementById('rvPerc').textContent = `${curPerc}%`;
    subSpeg.textContent = 'Nessuno spegnimento';
  }
}

function renderLiveHardware(d) {
  liveState = d || {};
  const kwh = (liveState.kwhImmesso || 0).toFixed(2);
  const watt = liveState.wattAttuali || 0;
  const kw = liveState.kwAttuali || 0;
  const staCaricando = (liveState.stato === 'in_corso' || watt > 50);
  presaAttualmenteAccesa = Boolean(liveState.presaAccesa || staCaricando);

  const badge = document.getElementById('stato-presa-badge');
  if (staCaricando) {
    badge.innerHTML = `🟢 IN CARICA: <b>${watt} W</b> (${kw} kW)<br>⚡ Energia reale immessa: <b>${kwh} kWh</b>`;
    badge.style.background = '#ecfdf5'; badge.style.color = '#15803d';
  } else if (liveState.presaAccesa) {
    badge.innerHTML = `🟡 PRESA ACCESA MA IN ATTESA (${watt} W)<br>⚡ Energia accumulata: <b>${kwh} kWh</b>`;
    badge.style.background = '#fefce8'; badge.style.color = '#a16207';
  } else if (liveState.stato === 'pausa') {
    badge.innerHTML = `🟡 RICARICA IN PAUSA (${watt} W)<br>⚡ Energia accumulata: <b>${kwh} kWh</b>`;
    badge.style.background = '#fefce8'; badge.style.color = '#a16207';
  } else {
    badge.innerHTML = `🔴 PRESA SPENTA (${watt} W)<br>⚡ Energia immessa: <b>${kwh} kWh</b>`;
    badge.style.background = '#fef2f2'; badge.style.color = '#b91c1c';
  }

  const btnToggle = document.getElementById('btn-toggle-presa');
  btnToggle.innerHTML = presaAttualmenteAccesa ? '🔌 Spegni Presa Ora' : '⚡ Accendi Presa Ora';
  btnToggle.style.background = presaAttualmenteAccesa ? '#fee2e2' : '#dcfce7';
  btnToggle.style.color = presaAttualmenteAccesa ? '#b91c1c' : '#15803d';

  const eraAttiva = programmazioneAttiva;
  const hasAcc = Boolean(liveState.accensioneProgrammataTs && liveState.accensioneProgrammataTs > Date.now());
  const hasSpeg = Boolean(liveState.spegnimentoProgrammatoTs && liveState.spegnimentoProgrammatoTs > Date.now());
  const oraAttiva = hasAcc || hasSpeg;

  if (oraAttiva && liveState.spegnimentoModo) {
    setSpegniMode(liveState.spegnimentoModo, false);
  }
  aggiornaBloccoCampiProgrammazione(oraAttiva);

  const inpAcc = document.getElementById('ora-accensione');
  const inpSpeg = document.getElementById('ora-spegnimento');
  const inpSpegPerc = document.getElementById('perc-spegnimento');

  if (eraAttiva && !oraAttiva) {
    inpAcc.value = '';
    inpSpeg.value = '';
    inpSpegPerc.value = '';
    aggiornaVisibilitaX();
    pushSharedState();
  } else if (oraAttiva) {
    if (hasAcc) inpAcc.value = formattaOraDaTs(liveState.accensioneProgrammataTs);
    if (hasSpeg) {
      if (liveState.spegnimentoModo === 'perc' && liveState.spegnimentoTargetPerc) {
        inpSpegPerc.value = liveState.spegnimentoTargetPerc;
      } else {
        inpSpeg.value = formattaOraDaTs(liveState.spegnimentoProgrammatoTs);
      }
    }
  }

  const btnReset = document.getElementById('btnResetSession');
  const haDati = Boolean(liveState.stato === 'pausa' || (liveState.kwhImmesso || 0) > 0 || (liveState.secondiAccumulati || 0) > 0);
  btnReset.style.display = (!staCaricando && haDati) ? 'block' : 'none';
  document.getElementById('cardCurrent').classList.toggle('dis', staCaricando);
  aggiornaCalcoli();
}
